name: Z Desk — Queue (self-serve consults)

# SELF-FIRE LANE (owner-approved "do all the things", 2026-11-02). Z (or the
# owner) enqueues JSON entries at queue/pending/ on the bus branch; this
# workflow drains up to MAX_PER_TICK of them every 10 minutes, runs the same
# z_desk consult as the manual lane, publishes receipts to runs/ on the bus,
# and moves each entry to queue/done/ with a status marker. Kill switch:
# disable this workflow's schedule (owner's click) — the queue then holds.
# Entries are PUBLIC and secret-red-lined exactly like manual briefs; caps
# are hard-clamped to QUEUE_CAP_USD per entry.
#
# CHECKOUT LANE (Mark's library-card design, 2026-11-03): a tick CLAIMS a due
# entry (pending/ -> claimed/, one commit) BEFORE running it; the git push is
# the atomic card swipe. Two workers (or a schedule + manual tick) can never
# run the same entry twice. The checkout is DUMB — no priority logic, no
# leases, no expiry; coordination and time windows are the circle's common
# sense. A held entry (future not_before) never consumes a claim slot.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      MAX_PER_TICK: "3"
      QUEUE_CAP_USD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Fetch pending entries from the bus branch
        run: |
          set -e
          git config user.name "island-bus"
          git config user.email "actions@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin bus > /dev/null 2>&1; then
            git fetch origin bus
            git ls-tree -r --name-only origin/bus | grep '^queue/pending/' | head -n 50 > /tmp/queue.txt || true
          else
            : > /tmp/queue.txt
            echo "no bus branch yet; queue empty"
          fi
          echo "pending entries listed this tick: $(wc -l < /tmp/queue.txt || echo 0)"
      - name: Claim due entries (dumb checkout; the circle does the thinking)
        if: always()
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          from island import queue as lane

          entries = [l.strip() for l in open('/tmp/queue.txt') if l.strip()]
          status_dir = pathlib.Path('queue-status')
          status_dir.mkdir(exist_ok=True)
          max_per_tick = int(os.environ.get('MAX_PER_TICK', '3'))
          due = []
          for i, entry in enumerate(entries, 1):
              status = {'entry': entry}
              try:
                  raw = subprocess.run(['git', 'show', f'origin/bus:{entry}'],
                                       capture_output=True, text=True, check=True).stdout
                  spec = lane.parse_entry(raw)
                  if not lane.entry_due(spec, lane.now_utc()):
                      status['status'] = 'held'
                      status['not_before'] = spec.get('not_before')
                      (status_dir / f'{i}.json').write_text(json.dumps(status))
                      print(f'held (not_before {spec.get("not_before")}): {entry}')
                      continue
                  due.append((i, entry, spec))
              except Exception as exc:
                  status['status'] = 'parse-error'
                  status['error'] = str(exc)[:200]
                  (status_dir / f'{i}.json').write_text(json.dumps(status))
          # A held or unparseable entry never consumes a claim slot: only the
          # first MAX_PER_TICK DUE entries are claimed this tick.
          due = due[:max_per_tick]

          # CHECKOUT: one commit moves pending -> claimed; the push IS the
          # atomic card swipe. Rejection (another worker got there first)
          # means claimed-elsewhere: report, move on, never collide.
          claimed = []
          if due:
              wt = '/tmp/bus-wt'
              subprocess.run(['git', 'worktree', 'add', '--detach', wt, 'origin/bus'],
                             check=True, capture_output=True)
              for arg in (('user.name', 'island-bus'),
                          ('user.email', 'actions@users.noreply.github.com')):
                  subprocess.run(['git', '-C', wt, 'config', arg[0], arg[1]],
                                 check=True, capture_output=True)

              def exists(path):
                  return subprocess.run(['git', '-C', wt, 'cat-file', '-e',
                                          f'origin/bus:{path}'],
                                         capture_output=True).returncode == 0

              def stage_batch():
                  # resync to the latest bus, then stage the moves fresh
                  subprocess.run(['git', '-C', wt, 'fetch', 'origin', 'bus'],
                                 check=True, capture_output=True)
                  subprocess.run(['git', '-C', wt, 'reset', '--hard', 'origin/bus'],
                                 check=True, capture_output=True)
                  batch = []
                  for i, entry, spec in due:
                      claim = lane.claim_path(entry)
                      if exists(claim) or not exists(entry):
                          (status_dir / f'{i}.json').write_text(json.dumps(
                              {'entry': entry, 'status': 'claimed-elsewhere'}))
                          print(f'claimed elsewhere (or gone): {entry}')
                          continue
                      subprocess.run(['git', '-C', wt, 'mv', entry, claim],
                                     check=True, capture_output=True)
                      batch.append((i, entry, spec))
                  return batch

              try:
                  for attempt in range(3):
                      batch = stage_batch()
                      if not batch:
                          break
                      subprocess.run(['git', '-C', wt, 'commit', '-q', '-m',
                                     f'queue: claim {len(batch)} entries by tick '
                                     f'{os.environ.get("GITHUB_RUN_ID", "local")}'],
                                    check=True, capture_output=True)
                      push = subprocess.run(['git', '-C', wt, 'push', 'origin', 'HEAD:bus'],
                                           capture_output=True, text=True)
                      if push.returncode == 0:
                          claimed = batch
                          break
                      print(f'claim push rejected (attempt {attempt + 1}); rechecking the shelf')
                  # due entries neither claimed nor already receipted = claim-failed
                  receipted = {i for i, _, _ in claimed} | {
                      i for i, _, _ in due if (status_dir / f'{i}.json').exists()}
                  for i, entry, _ in due:
                      if i not in receipted:
                          (status_dir / f'{i}.json').write_text(json.dumps(
                              {'entry': entry, 'status': 'claim-failed'}))
                          print(f'claim-failed (stays pending): {entry}')
              finally:
                  subprocess.run(['git', 'worktree', 'remove', '--force', wt],
                                 capture_output=True)
          with open('/tmp/claimed.txt', 'w') as fh:
              for i, entry, spec in claimed:
                  fh.write(json.dumps({'index': i, 'entry': entry, 'spec': spec}) + '\n')
          print(f'claimed {len(claimed)} entries this tick')
          PY
      - name: Run each claimed consult (a failed entry is receipted; the tick continues)
        if: always()
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess, sys
          from island import queue as lane
          status_dir = pathlib.Path('queue-status')
          status_dir.mkdir(exist_ok=True)
          ceiling = float(os.environ.get('QUEUE_CAP_USD', '1'))
          claimed = []
          if pathlib.Path('/tmp/claimed.txt').exists():
              claimed = [json.loads(l) for l in open('/tmp/claimed.txt') if l.strip()]
          for item in claimed:
              i, entry, spec = item['index'], item['entry'], item['spec']
              run_id = os.environ.get('GITHUB_RUN_ID', 'local')
              outdir = f'runs/z-desk-queue-{run_id}-{i}'
              status = {'entry': entry, 'run_outdir': outdir}
              try:
                  cap = lane.clamped_cap(spec, ceiling)
                  pathlib.Path('/tmp/brief.txt').write_text(spec.get('brief', ''))
                  cmd = [sys.executable, '-m', 'island.z_desk',
                         '--mode', 'live' if spec.get('mode') == 'live' else 'demo',
                         '--agents', spec.get('agents', 'both'),
                         '--diff-model', spec.get('diff_model', 'mistralai/mistral-medium-3-5'),
                         '--man-model', spec.get('man_model', 'openai/gpt-6-sol'),
                         '--skeptic-model', spec.get('skeptic_model', 'mistralai/mistral-medium-3-5'),
                         '--max-cost-usd', str(cap),
                         '--pace', spec.get('pace', 'half'),
                         '--brief-file', '/tmp/brief.txt',
                         '--outdir', outdir]
                  if spec.get('records'):
                      pathlib.Path('/tmp/records.txt').write_text(spec['records'])
                      cmd += ['--records-file', '/tmp/records.txt']
                  result = subprocess.run(cmd)
                  status['status'] = 'completed' if result.returncode == 0 else 'error'
              except Exception as exc:
                  status['status'] = 'error'
                  status['error'] = str(exc)[:200]
              (status_dir / f'{i}.json').write_text(json.dumps(status))
          print(f'ran {len(claimed)} claimed entries')
          PY
      - name: Publish receipts + dequeue on the bus branch
        if: always()
        run: |
          set -e
          git config user.name "island-bus"
          git config user.email "actions@users.noreply.github.com"
          if [ -d runs ] && [ -n "$(ls -A runs 2>/dev/null)" ]; then
            cp -r runs /tmp/bus-out
            rm -rf runs
          else
            echo "no run output to publish"
          fi
          if git ls-remote --exit-code --heads origin bus > /dev/null 2>&1; then
            git fetch origin bus
            git switch bus
          else
            git switch --orphan bus
          fi
          if [ -d /tmp/bus-out ]; then
            mkdir -p runs
            cp -r /tmp/bus-out/. runs/
            git add runs/
          fi
          if [ -d queue-status ]; then
            mkdir -p queue/done
            ts=$(date -u +%Y%m%dT%H%M%SZ)
            for status in queue-status/*.json; do
              [ -e "$status" ] || continue
              name=$(basename "$status" .json)
              set -- $(python -c "import json,sys;d=json.load(open(sys.argv[1]));print(d.get('entry',''),d.get('status',''))" "$status")
              entry="$1"; st="$2"
              case "$st" in
                held|claimed-elsewhere|claim-failed)
                  echo "$st entry left as-is: $entry"
                  continue
                  ;;
              esac
              if [ -n "$entry" ]; then
                if [ -e "$entry" ]; then
                  git rm -q "$entry"
                fi
                claim=$(python -c "from island.queue import claim_path;import sys;print(claim_path(sys.argv[1]))" "$entry")
                if [ -e "$claim" ]; then
                  git rm -q "$claim"
                fi
              fi
              cp "$status" "queue/done/${ts}-${name}.json"
              git add "queue/done/${ts}-${name}.json"
            done
          fi
          if ! git diff --cached --quiet; then
            git commit -m "bus: queue tick ${GITHUB_RUN_ID} (receipts + dequeue)"
            pushed=false
            for i in 1 2 3; do
              if git push origin bus; then pushed=true; break; fi
              git fetch origin bus
              git rebase origin/bus || break
            done
            if [ "$pushed" = false ]; then
              echo "PUBLISH RACE: bus push still rejected after retries; receipts preserved in run artifacts"
            fi
          else
            echo "nothing new to publish"
          fi
