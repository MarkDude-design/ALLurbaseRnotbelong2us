name: Island — Role Lens Comparison (manual, free)

# MODEL x STANCE: each catalog-verified zero-priced free model answers
# 4 synthetic scenarios under 3 roles (12 attempts per model).
# NOT scheduled. PR events only run no-network unit tests, never model calls.
on:
  workflow_dispatch:
    inputs:
      model_count:
        description: 'One model (12 calls smoke) or three models (36 calls full wave)'
        required: true
        type: choice
        default: '1'
        options: ['1', '3']
      confirm_free:
        description: 'yes = fire (any case). 12 or 36 OpenRouter free calls'
        required: true
        type: string
        default: 'yes'
  pull_request:
    paths:
      - 'scripts/island_stance_compare.py'
      - 'tests/test_island_stance_compare.py'
      - 'research/island-interviews/questionnaire-stance-v1.json'
      - '.github/workflows/island-stance-compare.yml'

concurrency:
  group: island-stance-compare-${{ github.repository }}
  cancel-in-progress: false

jobs:
  offline-tests:
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_island_stance_compare.py' -v

  compare:
    if: ${{ github.event_name == 'workflow_dispatch' && vars.ISLAND_INTERVIEWS_STOP != 'true' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify owner confirmation, role panel and free-only guard tests
        env:
          CONFIRM: ${{ inputs.confirm_free }}
          MODEL_COUNT: ${{ inputs.model_count }}
        run: |
          set -euo pipefail
          test "$(printf '%s' "$CONFIRM" | tr '[:upper:]' '[:lower:]')" = yes || { echo "Owner did not confirm (yes in any case). Zero provider calls."; exit 1; }
          case "$MODEL_COUNT" in 1|3) ;; *) echo "Model count must be 1 or 3"; exit 1 ;; esac
          python -m unittest discover -s tests -p 'test_island_stance_compare.py' -v
          python -m unittest discover -s tests -p 'test_island_model_interviews.py' -v
      - name: Call catalog-validated free models with bounded matched comparisons
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ALLOW_FREE_STANCE_COMPARE: YES
          MODEL_COUNT: ${{ inputs.model_count }}
        run: |
          set -euo pipefail
          python scripts/island_stance_compare.py \
            --model-limit "$MODEL_COUNT" \
            --max-attempts "$(( MODEL_COUNT * 12 ))" \
            --min-gap-seconds 6.5 \
            --max-seconds 1060 \
            --outdir "stance-runs/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Preserve raw receipts even if a provider STOP occurs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: island-stance-${{ github.run_id }}-${{ github.run_attempt }}
          path: stance-runs/
          if-no-files-found: warn
          retention-days: 30
      - name: Publish PUBLIC synthetic responses to bus branch
        if: always()
        run: |
          set -e
          if [ ! -d stance-runs ] || [ -z "$(ls -A stance-runs 2>/dev/null)" ]; then
            echo "No run evidence to publish, preflight gate may have stopped."
            exit 0
          fi
          cp -r stance-runs /tmp/island-stance-out
          rm -rf stance-runs
          git config user.name 'island-stance-bot'
          git config user.email 'actions@users.noreply.github.com'
          git fetch origin bus
          git switch bus
          mkdir -p stance-runs
          cp -r /tmp/island-stance-out/. stance-runs/
          git add stance-runs
          git diff --cached --quiet && exit 0
          git commit -m "bus: island stance ${{ github.run_id }} attempt ${{ github.run_attempt }}"
          for i in 1 2 3; do
            if git push origin bus; then exit 0; fi
            git fetch origin bus
            git rebase origin/bus || break
          done
          echo "Receipt bus push collided: downloadable Actions artifact remains."
          exit 1
