name: Z Desk — Free Calls (batched)

# Owner-triggered ONLY (no schedule, no issue-comment trigger): one click runs one
# batch of RAW free-model calls staged as a spec JSON in this repo. Born for the
# 2026-11-09 GPT-family free-first experiments (Luna + Terra pair specs). The runner
# verifies $0 prompt+completion pricing in the LIVE catalog immediately before the
# batch and aborts without sending otherwise; no retries, no paid fallback, no tools,
# no system prompt; sequential execution recorded. Receipts publish to the bus
# branch (runs/free-calls-*) like the other lanes. Kill switch: disable this
# workflow (owner's click). Z-lane (z-desk namespace), owner pre-approval banked
# 2026-11-09.

on:
  workflow_dispatch:
    inputs:
      spec_path:
        description: 'Repo path to the batch spec JSON'
        required: false
        type: string
        default: 'docs/free-calls/2026-11-09-gpt-family-pair-batch.json'

permissions:
  contents: write

concurrency:
  group: free-calls-bus
  cancel-in-progress: false

jobs:
  free-calls:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      SPEC_PATH: ${{ inputs.spec_path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Key exists
        run: test -n "$OPENROUTER_API_KEY"
      - name: Module imports
        run: python -c "import island.free_calls"
      - name: Spec exists
        run: test -f "$SPEC_PATH"
      - name: Run the batch
        run: |
          python -m island.free_calls \
            --spec "$SPEC_PATH" \
            --outdir "runs/free-calls-${GITHUB_RUN_ID}"
      - name: Archive receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: free-calls-${{ github.run_id }}
          path: runs/
          retention-days: 30
          if-no-files-found: warn
      - name: Publish receipts to the bus branch
        if: always()
        run: |
          set -e
          if [ ! -d runs ] || [ -z "$(ls -A runs 2>/dev/null)" ]; then
            echo "no run output to publish"
            exit 0
          fi
          cp -r runs /tmp/bus-out
          rm -rf runs
          git config user.name "island-bus"
          git config user.email "actions@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin bus > /dev/null 2>&1; then
            git fetch origin bus
            git switch bus
          else
            git switch --orphan bus
          fi
          mkdir -p runs
          cp -r /tmp/bus-out/. runs/
          git add runs/
          if ! git diff --cached --quiet; then
            git commit -m "bus: free-calls run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"
            git push origin bus
          else
            echo "nothing new to publish"
          fi
