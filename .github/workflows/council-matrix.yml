name: Council Matrix — Gas Mode

on:
  workflow_dispatch:
    inputs:
      cap:
        description: 'Local budget ceiling in USD per run (soft, post-call stop; the provider key cap still governs)'
        required: false
        default: '1'

permissions:
  contents: write

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CAP: ${{ inputs.cap }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Key exists
        run: test -n "$OPENROUTER_API_KEY"
      - name: Run the 9-run matrix (gas mode: a failed run is receipted, not fatal)
        run: sh scripts/run-matrix.sh "$CAP"
      - name: Archive receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: council-matrix-${{ github.run_id }}
          path: runs/
          retention-days: 30
          if-no-files-found: warn
      - name: Publish receipts to the bus branch
        if: always()
        run: |
          set -e
          if [ ! -d runs ] || [ -z "$(ls -A runs 2>/dev/null)" ]; then
            echo "no run output to publish"
            exit 0
          fi
          cp -r runs /tmp/bus-out
          rm -rf runs
          git config user.name "island-bus"
          git config user.email "actions@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin bus > /dev/null 2>&1; then
            git fetch origin bus
            git switch bus
          else
            git switch --orphan bus
          fi
          mkdir -p runs
          cp -r /tmp/bus-out/. runs/
          git add runs/
          if ! git diff --cached --quiet; then
            git commit -m "bus: council matrix ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"
            git push origin bus
          else
            echo "nothing new to publish"
          fi
