name: Island Pa More — Manual Baseline

on:
  workflow_dispatch:
    inputs:
      model_a:
        description: 'OpenRouter model ID for A / Meraki proxy (conversation runs; leave blank for council runs)'
        required: false
        type: string
      model_b:
        description: 'OpenRouter model ID for B / Z proxy (conversation runs; leave blank for council runs)'
        required: false
        type: string
      turns:
        description: 'Number of alternating turns'
        required: true
        type: choice
        default: '8'
        options: ['4', '8', '12', '16', '20', '32', '50', '100']
      topic:
        description: 'Starting topic'
        required: true
        type: string
        default: 'Emergence versus calibration: where should we begin?'
      topic_file:
        description: 'Optional: repo path to a seed file (e.g. docs/seeds/eko.md); overrides the topic field'
        required: false
        type: string
        default: ''
      first:
        description: 'Opening speaker (A or B)'
        required: true
        type: choice
        default: 'A'
        options: ['A', 'B']
      history_chars:
        description: 'Conversation history window in characters (how much of the run each turn can see)'
        required: true
        type: string
        default: '28000'
      provider_a:
        description: 'Optional provider slug for A'
        required: false
        type: string
      provider_b:
        description: 'Optional provider slug for B'
        required: false
        type: string
      council_file:
        description: 'Optional: repo path to a council seed file (e.g. docs/seeds/eko-council.md); when set, the run is a council instead of a conversation'
        required: false
        type: string
        default: ''
      max_cost:
        description: 'Local budget ceiling in USD for the run (soft, post-call stop; the provider key cap still governs)'
        required: false
        type: string
        default: '10'

permissions:
  contents: write

jobs:
  conversation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      MODEL_A: ${{ inputs.model_a }}
      MODEL_B: ${{ inputs.model_b }}
      PROVIDER_A: ${{ inputs.provider_a }}
      PROVIDER_B: ${{ inputs.provider_b }}
      TOPIC: ${{ inputs.topic }}
      TOPIC_FILE: ${{ inputs.topic_file }}
      TURNS: ${{ inputs.turns }}
      FIRST: ${{ inputs.first }}
      HISTORY_CHARS: ${{ inputs.history_chars }}
      MAX_COST: ${{ inputs.max_cost }}
      COUNCIL_FILE: ${{ inputs.council_file }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Key exists
        run: test -n "$OPENROUTER_API_KEY"
      - name: Run one bounded conversation
        if: ${{ inputs.council_file == '' }}
        run: |
          python -m island.runner --mode live \
            --model-a "$MODEL_A" --model-b "$MODEL_B" \
            --provider-a "$PROVIDER_A" --provider-b "$PROVIDER_B" \
            --topic "$TOPIC" --topic-file "$TOPIC_FILE" --turns "$TURNS" --first "$FIRST" \
            --history-chars "$HISTORY_CHARS" --max-cost-usd "$MAX_COST" \
            --outdir "runs/action-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Run one bounded council
        if: ${{ inputs.council_file != '' }}
        run: |
          python -m island.council --mode live \
            --council-file "$COUNCIL_FILE" \
            --max-cost-usd "$MAX_COST" \
            --outdir "runs/action-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
      - name: Archive reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: island-baseline-${{ github.run_id }}
          path: runs/
          retention-days: 30
          if-no-files-found: warn
      - name: Publish bus to the bus branch
        if: always()
        run: |
          set -e
          if [ ! -d runs ] || [ -z "$(ls -A runs 2>/dev/null)" ]; then
            echo "no run output to publish"
            exit 0
          fi
          cp -r runs /tmp/bus-out
          rm -rf runs
          git config user.name "island-bus"
          git config user.email "actions@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin bus > /dev/null 2>&1; then
            git fetch origin bus
            git switch bus
          else
            git switch --orphan bus
          fi
          mkdir -p runs
          cp -r /tmp/bus-out/. runs/
          git add runs/
          if ! git diff --cached --quiet; then
            git commit -m "bus: run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"
            git push origin bus
          else
            echo "nothing new to publish"
          fi
