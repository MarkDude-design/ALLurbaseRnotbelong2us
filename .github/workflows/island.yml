name: Island Pa More — Manual Baseline

on:
  workflow_dispatch:
    inputs:
      model_a:
        description: 'OpenRouter model ID for A / Meraki proxy (conversation runs; leave blank for council runs)'
        required: false
        type: string
      model_b:
        description: 'OpenRouter model ID for B / Z proxy (conversation runs; leave blank for council runs)'
        required: false
        type: string
      turns:
        description: 'Number of alternating turns'
        required: true
        type: choice
        default: '8'
        options: ['4', '8', '10', '12', '16', '20', '32', '50', '100']
      topic:
        description: 'Starting topic'
        required: true
        type: string
        default: 'Emergence versus calibration: where should we begin?'
      topic_file:
        description: 'Optional: repo path to a seed file (e.g. docs/seeds/eko.md); overrides the topic field'
        required: false
        type: string
        default: ''
      first:
        description: 'Opening speaker (A or B)'
        required: true
        type: choice
        default: 'A'
        options: ['A', 'B']
      history_chars:
        description: 'Conversation history window in characters (how much of the run each turn can see)'
        required: true
        type: string
        default: '28000'
      provider_a:
        description: 'Optional provider slug for A'
        required: false
        type: string
      provider_b:
