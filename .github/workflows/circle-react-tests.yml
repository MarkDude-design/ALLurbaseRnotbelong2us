name: Circle REACT — No-spend tests

on:
  pull_request:
    paths:
      - 'island/circle_react.py'
      - 'tests/test_circle_react.py'
      - 'docs/seeds/circle-island-react-v0.md'
      - '.github/workflows/circle-react.yml'
      - '.github/workflows/circle-react-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_circle_react.py' -v
